workflows:
  ios-build:
    name: "iOS Build (Capacitor)"
    instance_type: mac_mini_m1
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic_api_key  # Nombre de tu API Key en Codemagic UI
    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - dist_profile
        certificates:
          - dist_cert
    scripts:
      - name: Install npm dependencies
        script: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Web App
        script: |
          npm run build

      - name: Sync iOS platform
        script: |
          npx cap sync ios

      - name: Set up Code Signing
        script: |
          xcode-project use-profiles

      - name: Build iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
